name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['build/build_extra.sh', 'build/extra-packages.txt', '.github/ISSUE_TEMPLATE/**', '.github/workflows/wheels.yml', '.github/workflows/termux.yml', 'tests/**', '**.md']
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    # arm64-v8a — APK для телефонов; x86_64 — та же сборка для эмулятора, на нём CI проверяет, что Python в APK работает
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ABI: ${{ matrix.abi }}
      FRX_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4

      # Код FRX кладётся в APK, чтобы первая установка шла без скачивания.
      # Пока FRX-Userbot приватный, нужен секрет FRX_USERBOT_TOKEN (токен с правом чтения этого репозитория);
      # без него сборка не падает — приложение скачает FRX при первом запуске.
      - name: Код FRX
        id: frx
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Shxdowrate/FRX-Userbot
          token: ${{ secrets.FRX_USERBOT_TOKEN || github.token }}
          path: frx-src
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # pydantic-core и Pillow собираются долго — храним собранное между запусками
      - uses: actions/cache@v4
        with:
          path: |
            out/${{ matrix.abi }}/python-android
            out/${{ matrix.abi }}/python-android.tar.gz
            out/${{ matrix.abi }}/wheels
            out/${{ matrix.abi }}/deps
            out/${{ matrix.abi }}/ffmpeg-prefix
          key: build-${{ matrix.abi }}-${{ hashFiles('versions.env', 'build/*.sh', 'build/*.c') }}-${{ github.run_number }}
          restore-keys: |
            build-${{ matrix.abi }}-${{ hashFiles('versions.env', 'build/*.sh', 'build/*.c') }}-
            build-${{ matrix.abi }}-

      - name: Python для Android
        run: build/step.sh python build/fetch_python.sh

      - name: Запускатель python
        run: build/step.sh launcher build/build_launcher.sh

      - name: Подбор пакетов
        run: build/step.sh resolve python build/resolve.py resolve

      - name: pydantic-core
        run: build/step.sh pydantic-core build/build_pydantic_core.sh

      - name: Pillow
        run: build/step.sh pillow build/build_pillow.sh

      - name: ffmpeg
        run: build/step.sh ffmpeg build/build_ffmpeg.sh

      - name: Остальные пакеты
        run: build/step.sh collect python build/resolve.py collect

      - name: Сборка assets
        run: |
          if [ "${{ steps.frx.outcome }}" = "success" ] && [ -f frx-src/frx_systemkeeper.py ]; then
            build/step.sh assemble python build/assemble.py --frx frx-src
          else
            echo "::warning::FRX-Userbot не прочитан — APK будет скачивать FRX при первом запуске (секрет FRX_USERBOT_TOKEN)"
            build/step.sh assemble python build/assemble.py
          fi

      - name: Ключ подписи
        env:
          KS: ${{ secrets.FRX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/frx.jks"
            echo "FRX_KEYSTORE_FILE=$RUNNER_TEMP/frx.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Нет секрета FRX_KEYSTORE_B64 — APK подписан отладочным ключом (обновлять поверх не выйдет)"
          fi

      - name: APK
        working-directory: android
        env:
          FRX_KEYSTORE_PASSWORD: ${{ secrets.FRX_KEYSTORE_PASSWORD }}
          FRX_KEY_ALIAS: ${{ secrets.FRX_KEY_ALIAS }}
          FRX_KEY_PASSWORD: ${{ secrets.FRX_KEY_PASSWORD }}
          FRX_APK_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export FRX_APK_VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            export FRX_APK_VERSION_NAME="1.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          suffix=""; [ "$ABI" = "x86_64" ] && suffix="-x86_64"
          echo "APK_NAME=FRX-${FRX_APK_VERSION_NAME}${suffix}.apk" >> "$GITHUB_ENV"
          ../build/step.sh gradle gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../FRX-${FRX_APK_VERSION_NAME}${suffix}.apk"
          ls -la ../*.apk

      - name: KVM для эмулятора
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Проверка на эмуляторе (Android 14)
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: build/step.sh selftest build/emulator_test.sh "${{ env.APK_NAME }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      # каждая сборка main — в пре-релиз «dev» (постоянная ссылка, удобно ставить на телефон)
      - name: Пре-релиз dev
        if: github.ref == 'refs/heads/main' && matrix.abi == 'arm64-v8a'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$APK_NAME" FRX-dev.apk
          gh release view dev >/dev/null 2>&1 || gh release create dev --prerelease --title "FRX dev" \
            --notes "Свежая сборка из main. Для обычного использования берите последний релиз." --target "$GITHUB_SHA"
          git tag -f dev "$GITHUB_SHA" && git push -f origin refs/tags/dev
          gh release upload dev FRX-dev.apk --clobber
          gh release edit dev --notes "Свежая сборка из main: ${GITHUB_SHA::7}, сборка №${GITHUB_RUN_NUMBER}. Для обычного использования берите последний релиз."

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v') && matrix.abi == 'arm64-v8a'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
